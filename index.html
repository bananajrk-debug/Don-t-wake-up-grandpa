<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地上300mの窓ふき（仮）</title>
<style>
:root{--ink:#2b2622;--paper:#fbf7ee;--line:#8a7a66}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fc4ea;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas{display:block;cursor:none}
.hidden{display:none!important}
#hud{position:fixed;top:10px;left:10px;background:rgba(251,247,238,.94);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:13px;width:230px}
#hud .row{display:flex;justify-content:space-between;margin:2px 0}
#hud b{font-size:15px}
.gauge{height:10px;border-radius:5px;background:#e3dac9;border:1px solid var(--line);overflow:hidden;margin:2px 0 6px}
.gauge div{height:100%;transition:width .1s}
#grip{background:#e2572b}#water{background:#3b8fd8}
#help{position:fixed;right:10px;top:10px;background:rgba(251,247,238,.9);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.7}
#banner{position:fixed;top:24%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 10px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none;text-align:center}
#banner.warn{color:#ffd84a}#banner.bad{color:#ff7a66}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,45,60,.5)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:22px 26px;width:min(480px,92vw);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.card h1{margin:0 0 6px;font-size:28px}
.card h2{margin:0 0 8px;font-size:24px}
.card p{margin:6px 0;line-height:1.6}
.card table{width:100%;border-collapse:collapse;margin:8px 0}
.card td{padding:5px 4px;border-bottom:1px dashed #cdbfa8}
.card td:last-child{text-align:right;font-weight:800}
.rank{font-size:60px;font-weight:900;text-align:center;line-height:1}
button{font:inherit;font-weight:800;padding:10px 18px;border:2px solid var(--ink);border-radius:10px;background:#ffe08a;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.small{font-size:12px;color:#6b5a4a}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div class="row"><span>残り時間</span><b id="hTime">3:00</b></div>
  <div class="row"><span>ピカピカの窓</span><b id="hDone">0 / 10</b></div>
  <div class="row"><span>高さ</span><b id="hAlt">0 m</b></div>
  <div class="small">握力（ぶら下がると減る）</div>
  <div class="gauge"><div id="grip"></div></div>
  <div class="small">バケツの水（屋上で補充）</div>
  <div class="gauge"><div id="water"></div></div>
</div>
<div id="help" class="hidden">
  W / S：ロープを上る・下りる<br>
  A / D：横に移動<br>
  マウスを押しながら動かす：窓をふく<br>
  Space長押し：壁にしがみつく（突風対策）<br>
  ハトをクリック：追い払う<br>
  窓の下のでっぱりに立つと握力が回復
</div>
<div id="banner"></div>
<div id="start" class="screen">
  <div class="card">
    <h1>地上300mの窓ふき（仮）</h1>
    <p>新人窓ふき職人の初仕事。5階建てのビルの窓10枚を、3分以内にピカピカにして屋上に戻ろう。</p>
    <p class="small">突風、怒るハト、窓の向こうの人たち、そして握力切れに気をつけて。</p>
    <p style="text-align:center;margin-top:14px"><button id="startBtn">仕事を始める</button></p>
  </div>
</div>
<div id="result" class="screen hidden"><div class="card" id="resultCard"></div></div>

<script>
'use strict';
// =====================================================================
// 定数（単位はメートル。y は下向きが正。屋上の端が y=0）
// =====================================================================
const BW = 12;               // ビルの幅
const FLOORS = 5;
const FH = 3.5;              // 1フロアの高さ
const GROUND = 0.5 + FLOORS * FH; // 地面の y
const CELL = 0.2;            // 汚れの1マス
const GX = 20, GY = 11;      // 窓1枚のマス数（4m × 2.2m）
const REACH = 1.8;           // 手が届く距離
const WIPE_R = 0.32;         // スクイージーの半径
const TIME_LIMIT = 180;
const ROOF_Y = -0.8;         // 屋上に立っているときの体の中心

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, S = 40;
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(H / 9.5, W / 15);
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = (id) => document.getElementById(id);

// =====================================================================
// 効果音
// =====================================================================
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; }
function tone(f1, f2, dur, type = 'sine', vol = 0.1) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, freq, vol) {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const SFX = {
  squeak() { tone(rand(1300, 1700), rand(1700, 2100), 0.07, 'triangle', 0.04); },
  shine() { tone(1200, 1200, 0.1, 'triangle', 0.1); setTimeout(() => tone(1800, 1800, 0.18, 'triangle', 0.1), 90); },
  gust() { noise(2.4, 400, 0.35); },
  flap() { noise(0.25, 2500, 0.25); },
  slip() { tone(700, 120, 0.5, 'sawtooth', 0.08); },
  thud() { tone(140, 50, 0.3, 'sine', 0.3); },
  refill() { noise(0.5, 900, 0.2); },
};

// =====================================================================
// ゲームの状態
// =====================================================================
let state = 'title';
let windows = [];
let P = null;        // プレイヤー
let pigeon = null;
let gust = null;
let time = 0;
let camX = BW / 2, camY = ROOF_Y;
let bubbles = [];
let particles = [];
let falling = [];    // 落ちていくバケツ
let cars = [];
let walkers = [];
let stats = null;
let allDoneAnnounced = false;
let personTimer = 4;
const skyline = [];
for (let x = -40; x < 52; x += rand(2.5, 5)) skyline.push({ x, w: rand(2.5, 4.5), h: rand(8, 30), c: Math.random() < 0.5 ? '#a9c3d6' : '#b9cddc' });
const clouds = Array.from({ length: 7 }, () => ({ x: rand(-30, 40), y: rand(-14, -4), s: rand(1.5, 3.5), v: rand(0.2, 0.5) }));

const INTERIORS = ['office', 'meeting', 'office', 'kitchen', 'office', 'storage'];
const PERSON_LINES = ['……（じっと見ている）', 'おつかれさまでーす', '（会議中です）', '手、振っとこ', 'あ、そこまだ汚れてますよ', 'すごい、高いのに…', '（コーヒーをすする）', 'がんばれー'];

function makeDirt() {
  const c = new Float32Array(GX * GY);
  for (let i = 0; i < c.length; i++) c[i] = 0.22 + Math.random() * 0.1;
  const blobs = 6 + Math.floor(Math.random() * 5);
  for (let b = 0; b < blobs; b++) {
    const bx = rand(0, GX), by = rand(0, GY), r = rand(1.5, 4.5), s = rand(0.4, 0.8);
    for (let y = 0; y < GY; y++) for (let x = 0; x < GX; x++) {
      const d = Math.hypot(x - bx, y - by);
      if (d < r) c[y * GX + x] += s * (1 - d / r);
    }
  }
  // 雨だれの筋
  for (let k = 0; k < 4; k++) {
    const x = Math.floor(rand(0, GX)), y0 = Math.floor(rand(0, GY / 2));
    for (let y = y0; y < GY; y++) c[y * GX + x] += 0.35;
  }
  for (let i = 0; i < c.length; i++) c[i] = clamp(c[i], 0, 1);
  return c;
}

function newGame() {
  windows = [];
  for (let f = 0; f < FLOORS; f++) {
    for (let col = 0; col < 2; col++) {
      const cells = makeDirt();
      let sum = 0;
      for (const v of cells) sum += v;
      windows.push({
        floor: FLOORS - f, x: col ? 6.5 : 1.5, y: 0.5 + f * FH + 0.6, w: 4, h: 2.2,
        cells, sum, total: sum, done: false, sparkle: 0, cv: null, dirty: true,
        interior: INTERIORS[Math.floor(Math.random() * INTERIORS.length)],
        person: null,
      });
    }
  }
  P = { x: BW / 2, y: ROOF_Y, vx: 0, ax: BW / 2, grip: 100, water: 100, cling: false, onSill: false, onRoof: true, facing: 1, stun: 0 };
  const nestWin = windows[2 + Math.floor(Math.random() * 6)];
  pigeon = { nx: nestWin.x + nestWin.w - 0.35, ny: nestWin.y + nestWin.h, x: 0, y: 0, mode: 'nest', cd: 0, t: 0, scaredT: 0, hitDone: false };
  pigeon.x = pigeon.nx; pigeon.y = pigeon.ny;
  gust = { next: rand(14, 20), warn: 0, active: 0, dir: 1 };
  time = 0;
  camY = ROOF_Y + 2;
  bubbles = []; particles = []; falling = [];
  cars = Array.from({ length: 5 }, (_, i) => ({ x: rand(-10, 22), v: rand(2, 5) * (i % 2 ? 1 : -1), c: ['#e74c3c', '#3b7dd8', '#f1c40f', '#ecf0f1', '#2ecc71'][i] }));
  walkers = Array.from({ length: 8 }, () => ({ x: rand(-6, 18), v: rand(0.5, 1.2) * (Math.random() < 0.5 ? -1 : 1), c: ['#c0392b', '#2c3e50', '#8e44ad', '#16a085'][Math.floor(rand(0, 4))] }));
  stats = { slips: 0, pigeonHits: 0, buckets: 0, refills: 0 };
  allDoneAnnounced = false;
  personTimer = 4;
}

// =====================================================================
// 表示の補助
// =====================================================================
const sx = (x) => (x - camX) * S + W / 2;
const sy = (y) => (y - camY) * S + H / 2;
const wx = (px) => (px - W / 2) / S + camX;
const wy = (py) => (py - H / 2) / S + camY;

function bubble(text, x, y, opt = {}) {
  bubbles.push({ text, x, y, t: opt.dur || 1.6, max: opt.dur || 1.6, color: opt.color || '#fff', ink: opt.ink || '#2b2622', follow: opt.follow || null, size: opt.size || 15 });
}
let bannerT = 0;
function banner(text, cls = '', dur = 1.6) {
  const b = $('banner');
  b.textContent = text; b.className = cls; bannerT = dur;
}

// =====================================================================
// 入力
// =====================================================================
const keys = {};
const mouse = { x: 0, y: 0, down: false, lwx: null, lwy: null };
addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
cv.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', (e) => {
  mouse.down = true; mouse.lwx = null;
  if (state !== 'play') return;
  // ハトをクリックで追い払う
  const mxw = wx(e.clientX), myw = wy(e.clientY);
  if (pigeon.mode !== 'gone' && Math.hypot(mxw - pigeon.x, myw - pigeon.y) < 0.7) {
    pigeon.mode = 'gone'; pigeon.scaredT = 12; pigeon.vx = rand(-3, 3); pigeon.vy = -5;
    SFX.flap();
    bubble('バサバサッ', pigeon.x, pigeon.y - 0.5, { color: '#eef6ff' });
  }
});
addEventListener('mouseup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', (e) => e.preventDefault());

// =====================================================================
// 窓ふき
// =====================================================================
function wipeAt(x, y) {
  let removed = 0;
  const floorV = P.water > 0 ? 0 : 0.38; // 水がないと拭きムラが残る
  for (const w of windows) {
    if (x < w.x - WIPE_R || x > w.x + w.w + WIPE_R || y < w.y - WIPE_R || y > w.y + w.h + WIPE_R) continue;
    const cx = (x - w.x) / CELL, cy = (y - w.y) / CELL, r = WIPE_R / CELL;
    for (let gy = Math.floor(cy - r); gy <= Math.ceil(cy + r); gy++) {
      if (gy < 0 || gy >= GY) continue;
      for (let gx = Math.floor(cx - r); gx <= Math.ceil(cx + r); gx++) {
        if (gx < 0 || gx >= GX) continue;
        if (Math.hypot(gx + 0.5 - cx, gy + 0.5 - cy) > r) continue;
        const i = gy * GX + gx, d = w.cells[i];
        if (d <= floorV) continue;
        const take = Math.min(d - floorV, 0.2);
        w.cells[i] -= take; w.sum -= take; removed += take; w.dirty = true;
      }
    }
    if (!w.done && w.sum / w.total <= 0.03) {
      w.done = true; w.sparkle = 1.2;
      for (let i = 0; i < w.cells.length; i++) w.cells[i] = 0;
      w.sum = 0; w.dirty = true;
      SFX.shine();
      bubble('ピカッ！', w.x + w.w / 2, w.y - 0.2, { color: '#fff7c2', size: 18 });
    }
  }
  return removed;
}

function dirtyWindowNear(x, y) {
  let best = null, bd = 99;
  for (const w of windows) {
    const d = Math.hypot(w.x + w.w / 2 - x, w.y + w.h / 2 - y);
    if (d < bd) { bd = d; best = w; }
  }
  if (!best) return;
  const bx = rand(3, GX - 3), by = rand(2, GY - 2);
  for (let gy = 0; gy < GY; gy++) for (let gx = 0; gx < GX; gx++) {
    const d = Math.hypot(gx - bx, gy - by);
    if (d < 2.6) {
      const i = gy * GX + gx, add = Math.min(1 - best.cells[i], 0.9 * (1 - d / 2.6));
      best.cells[i] += add; best.sum += add;
    }
  }
  best.dirty = true;
  if (best.done) { best.done = false; allDoneAnnounced = false; }
}

// =====================================================================
// 更新
// =====================================================================
function sillUnder(x, feet) {
  for (const w of windows) {
    const ly = w.y + w.h;
    if (x > w.x - 0.25 && x < w.x + w.w + 0.25 && feet > ly - 0.3 && feet < ly + 0.12) return ly;
  }
  return null;
}

function update(dt) {
  time += dt;
  const up = keys.KeyW || keys.ArrowUp, down = keys.KeyS || keys.ArrowDown;
  const left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight;
  const ix = (right ? 1 : 0) - (left ? 1 : 0);
  if (ix) P.facing = ix;
  P.stun = Math.max(0, P.stun - dt);

  // 上下（ロープの長さ）
  const vy = P.stun > 0 ? 0 : (down ? 1.8 : 0) - (up ? 1.6 : 0);
  P.y = clamp(P.y + vy * dt, ROOF_Y, GROUND - 0.9);
  P.onRoof = P.y <= ROOF_Y + 0.01;
  P.cling = !!keys.Space && !P.onRoof;

  // 突風
  let gustF = 0;
  if (gust.warn > 0) {
    gust.warn -= dt;
    if (gust.warn <= 0) { gust.active = 2.6; SFX.gust(); }
  } else if (gust.active > 0) {
    gust.active -= dt;
    gustF = gust.dir * 9;
    if (Math.random() < dt * 25) particles.push({ x: camX - gust.dir * 10, y: camY + rand(-5, 5), vx: gust.dir * rand(10, 16), vy: rand(-1, 1), t: 2, kind: Math.random() < 0.3 ? 'paper' : 'leaf' });
    if (gust.active <= 0) gust.next = rand(12, 20);
  } else {
    gust.next -= dt;
    if (gust.next <= 0) {
      gust.dir = Math.random() < 0.5 ? -1 : 1;
      gust.warn = 1.8;
      banner(`突風が来る！ ${gust.dir > 0 ? '→' : '←'}  Spaceでしがみつけ！`, 'warn', 1.8);
    }
  }

  // 横の動き
  if (P.onRoof) {
    P.x = clamp(P.x + ix * 3 * dt + gustF * 0.03 * dt, 0.4, BW - 0.4);
    P.ax = P.x; P.vx = 0;
  } else {
    // 屋上のレールを滑車が動き、体はその下で振り子のように揺れる
    P.ax = clamp(P.ax + ix * 2.2 * dt, 0.3, BW - 0.3);
    const L = Math.max(1, P.y);
    let acc = -(9.8 / L) * (P.x - P.ax) - 2.2 * P.vx;
    const feet = P.y + 0.8;
    const sill = sillUnder(P.x, feet);
    P.onSill = sill !== null && !up && !down;
    if (P.onSill) P.y = sill - 0.8;
    if (P.cling) {
      P.vx *= Math.exp(-12 * dt);
      acc = -(9.8 / L) * (P.x - P.ax) * 0.3;
    } else {
      acc += gustF * (P.onSill ? 0.45 : 1);
      if (P.onSill) P.vx *= Math.exp(-4 * dt);
    }
    P.vx += acc * dt;
    P.x += P.vx * dt;
    if (P.x < -1.5 || P.x > BW + 1.5) { P.x = clamp(P.x, -1.5, BW + 1.5); P.vx *= -0.4; }
  }

  // 窓をふく
  let wiping = false;
  const mxw = wx(mouse.x), myw = wy(mouse.y);
  const hx = P.x, hy = P.y - 0.3;
  const inReach = Math.hypot(mxw - hx, myw - hy) <= REACH;
  if (mouse.down && inReach && P.stun <= 0) {
    if (mouse.lwx !== null) {
      const dist = Math.hypot(mxw - mouse.lwx, myw - mouse.lwy);
      if (dist > 0.01) {
        const steps = Math.ceil(dist / 0.06);
        let removed = 0;
        for (let i = 1; i <= steps; i++) removed += wipeAt(mouse.lwx + ((mxw - mouse.lwx) * i) / steps, mouse.lwy + ((myw - mouse.lwy) * i) / steps);
        if (removed > 0) {
          wiping = true;
          P.water = Math.max(0, P.water - removed * 0.26);
          if (Math.random() < 0.25) SFX.squeak();
          if (Math.random() < 0.3) particles.push({ x: mxw, y: myw, vx: rand(-0.5, 0.5), vy: rand(0, 1), t: 0.8, kind: 'drop' });
        }
      }
    }
    mouse.lwx = mxw; mouse.lwy = myw;
  } else {
    mouse.lwx = null;
  }

  // 握力
  if (P.onRoof) {
    P.grip = Math.min(100, P.grip + 35 * dt);
    if (P.water < 100) {
      if (P.water < 99 && Math.random() < dt * 2) SFX.refill();
      if (P.water < 20) stats.refills++;
      P.water = 100;
    }
  } else if (P.onSill) {
    P.grip = Math.min(100, P.grip + (wiping ? 6 : 16) * dt);
  } else {
    P.grip -= (3.5 + (wiping ? 4 : 0) + (P.cling ? 12 : 0) + (gust.active > 0 && !P.cling ? 3 : 0)) * dt;
  }
  if (P.grip <= 0 && !P.onRoof) {
    // 手がすべった
    P.grip = 40;
    P.y = Math.min(GROUND - 0.9, P.y + 3);
    P.vx += rand(-3, 3);
    P.stun = 1.2;
    stats.slips++;
    SFX.slip();
    banner('手がすべった！！', 'bad', 1.4);
    bubble('うわあああ！', P.x, P.y - 1.2, { color: '#ff6b55', ink: '#fff', size: 18 });
    if (P.water > 0 || true) {
      falling.push({ x: P.x + 0.3, y: P.y + 0.3, vy: 0, vx: rand(-0.5, 0.5), rot: 0 });
      P.water = 0;
      stats.buckets++;
    }
  }

  // ハト
  updatePigeon(dt);

  // 窓の中の人
  personTimer -= dt;
  if (personTimer <= 0) {
    personTimer = rand(5, 9);
    const near = windows.filter((w) => !w.person && Math.abs(w.y + w.h / 2 - P.y) < 5);
    if (near.length) {
      const w = near[Math.floor(Math.random() * near.length)];
      w.person = { t: 4.5, px: rand(0.8, w.w - 0.8), text: PERSON_LINES[Math.floor(Math.random() * PERSON_LINES.length)], said: false };
    }
  }
  for (const w of windows) {
    if (w.sparkle > 0) w.sparkle -= dt;
    if (!w.person) continue;
    w.person.t -= dt;
    if (!w.person.said && w.person.t < 3.8) {
      w.person.said = true;
      const clean = 1 - w.sum / w.total;
      if (clean > 0.4) bubble(w.person.text, w.x + w.person.px, w.y + 0.5, { color: '#eef7ff', dur: 2.6, size: 13 });
    }
    if (w.person.t <= 0) w.person = null;
  }

  // 落ちていくバケツ
  for (let i = falling.length - 1; i >= 0; i--) {
    const f = falling[i];
    f.vy += 9.8 * dt; f.y += f.vy * dt; f.x += f.vx * dt; f.rot += dt * 6;
    if (f.y >= GROUND - 0.15) {
      SFX.thud();
      bubble(Math.random() < 0.5 ? '下の人「あぶなっ！」' : '下の人「ひえっ！」', f.x, GROUND - 1, { color: '#fff', dur: 2.2, size: 14 });
      for (let k = 0; k < 10; k++) particles.push({ x: f.x, y: GROUND - 0.1, vx: rand(-3, 3), vy: rand(-4, -1), t: 0.8, kind: 'drop' });
      falling.splice(i, 1);
    }
  }

  // 景色
  for (const c of cars) { c.x += c.v * dt; if (c.x > 26) c.x = -14; if (c.x < -14) c.x = 26; }
  for (const p of walkers) { p.x += p.v * dt; if (p.x > 22) p.x = -10; if (p.x < -10) p.x = 22; }
  for (const c of clouds) { c.x += c.v * dt; if (c.x > 45) c.x = -35; }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'drop') p.vy += 9.8 * dt;
    if (p.t <= 0) particles.splice(i, 1);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t -= dt; if (bubbles[i].t <= 0) bubbles.splice(i, 1); }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').textContent = ''; }

  // カメラ
  const k = 1 - Math.exp(-4 * dt);
  camY += (P.y + 1.2 - camY) * k;
  camX += (clamp(P.x, BW / 2 - 3, BW / 2 + 3) - camX) * k;

  // 終了判定
  const doneN = windows.filter((w) => w.done).length;
  if (doneN === windows.length && !allDoneAnnounced) {
    allDoneAnnounced = true;
    banner('全部ピカピカ！ 屋上に戻れ！', '', 2.5);
  }
  if (doneN === windows.length && P.onRoof) finish(true);
  else if (time >= TIME_LIMIT) finish(false);

  // HUD
  const left_ = Math.max(0, TIME_LIMIT - time);
  $('hTime').textContent = `${Math.floor(left_ / 60)}:${String(Math.floor(left_ % 60)).padStart(2, '0')}`;
  $('hTime').style.color = left_ < 30 ? '#c0392b' : '';
  $('hDone').textContent = `${doneN} / ${windows.length}`;
  $('hAlt').textContent = `${Math.max(0, (GROUND - (P.y + 0.8))).toFixed(1)} m`;
  $('grip').style.width = P.grip + '%';
  $('grip').style.background = P.grip < 25 ? '#c0392b' : '#e2572b';
  $('water').style.width = P.water + '%';
}

function updatePigeon(dt) {
  const pg = pigeon;
  pg.t += dt;
  pg.cd = Math.max(0, pg.cd - dt);
  const dx = P.x - pg.x, dy = (P.y - 0.4) - pg.y, d = Math.hypot(dx, dy);
  if (pg.mode === 'nest') {
    pg.x = pg.nx; pg.y = pg.ny;
    const dn = Math.hypot(P.x - pg.nx, P.y - pg.ny);
    if (dn < 2.6 && pg.cd <= 0 && !P.onRoof) {
      pg.mode = 'attack'; SFX.flap();
      bubble('クルッポー！！', pg.x, pg.y - 0.5, { color: '#ffe2b8' });
    }
  } else if (pg.mode === 'attack') {
    const sp = 6;
    pg.x += (dx / d) * sp * dt; pg.y += (dy / d) * sp * dt;
    if (d < 0.5) {
      P.vx += Math.sign(dx || 1) * 3.5;
      P.grip = Math.max(0, P.grip - 12);
      stats.pigeonHits++;
      SFX.flap();
      bubble('バサバサバサッ！', P.x, P.y - 1.1, { color: '#ffe2b8', size: 17 });
      dirtyWindowNear(P.x, P.y);
      bubble('（フンが…）', P.x + 0.8, P.y - 0.3, { color: '#f4ecd8', size: 12 });
      pg.mode = 'return'; pg.cd = 7;
    }
    if (pg.t > 30) pg.mode = 'return';
  } else if (pg.mode === 'return') {
    const ex = pg.nx - pg.x, ey = pg.ny - pg.y, e = Math.hypot(ex, ey);
    if (e < 0.1) { pg.mode = 'nest'; pg.t = 0; }
    else { pg.x += (ex / e) * 4 * dt; pg.y += (ey / e) * 4 * dt; }
  } else if (pg.mode === 'gone') {
    pg.scaredT -= dt;
    pg.x += pg.vx * dt; pg.y += pg.vy * dt;
    if (pg.scaredT <= 0) { pg.mode = 'return'; pg.x = pg.nx + 8; pg.y = pg.ny - 6; pg.cd = 3; }
  }
}

function finish(success) {
  state = 'result';
  const doneN = windows.filter((w) => w.done).length;
  const clean = windows.reduce((s, w) => s + (1 - w.sum / w.total), 0) / windows.length;
  const t = Math.min(TIME_LIMIT, time);
  let score = Math.round(clean * 100) + (success ? Math.round(TIME_LIMIT - t) : 0) - stats.slips * 10 - stats.buckets * 5;
  const rank = !success ? (clean > 0.7 ? 'B' : 'C') : score >= 150 ? 'S' : score >= 120 ? 'A' : 'B';
  const msg = success ? (stats.slips === 0 ? '完璧な仕事！ 親方もにっこり' : '終わった…けど何度か死にかけた') : '時間切れ…親方に怒られる';
  $('resultCard').innerHTML = `
    <h2>${msg}</h2>
    <div class="rank">${rank}</div>
    <table>
      <tr><td>ピカピカにした窓</td><td>${doneN} / ${windows.length}</td></tr>
      <tr><td>きれいさ（平均）</td><td>${Math.round(clean * 100)}%</td></tr>
      <tr><td>かかった時間</td><td>${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}</td></tr>
      <tr><td>手がすべった回数</td><td>${stats.slips} 回</td></tr>
      <tr><td>落としたバケツ</td><td>${stats.buckets} 個</td></tr>
      <tr><td>ハトにやられた回数</td><td>${stats.pigeonHits} 回</td></tr>
    </table>
    <p style="text-align:center"><button id="again">もう一度</button></p>`;
  $('result').classList.remove('hidden');
  $('again').onclick = () => { $('result').classList.add('hidden'); newGame(); state = 'play'; };
}

// =====================================================================
// 描画
// =====================================================================
function draw() {
  // 空
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6fb2e6'); g.addColorStop(1, '#cfe7f7');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 雲（遠景）
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const c of clouds) {
    const x = (c.x - camX * 0.15) * S * 0.6 + W / 2, y = (c.y - camY * 0.2) * S * 0.6 + H / 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + i * c.s * 14, y + (i === 1 ? -c.s * 6 : 0), c.s * 14, 0, 7); ctx.fill(); }
  }
  // 遠くのビル
  for (const b of skyline) {
    const par = 0.45;
    const x = (b.x - camX * par) * S * 0.7 + W / 2;
    const base = (GROUND - camY * par) * S * 0.7 + H / 2 + (1 - par) * 0;
    const top = base - b.h * S * 0.7;
    ctx.fillStyle = b.c;
    ctx.fillRect(x, top, b.w * S * 0.7, base - top + 400);
  }

  // 地面
  const gy = sy(GROUND);
  ctx.fillStyle = '#9a9a9a'; ctx.fillRect(0, gy, W, H);
  ctx.fillStyle = '#c9c4ba'; ctx.fillRect(0, gy, W, 0.6 * S);
  ctx.fillStyle = '#555'; ctx.fillRect(0, gy + 0.6 * S, W, 2.5 * S);
  ctx.fillStyle = '#eee';
  for (let x = -20; x < 40; x += 2) ctx.fillRect(sx(x), gy + 1.8 * S, 1 * S, 0.1 * S);
  for (const c of cars) {
    ctx.fillStyle = c.c;
    ctx.fillRect(sx(c.x), gy + (c.v > 0 ? 0.8 : 1.9) * S, 1.8 * S, 0.6 * S);
    ctx.fillStyle = '#222';
    ctx.fillRect(sx(c.x) + 0.2 * S, gy + (c.v > 0 ? 1.35 : 2.45) * S, 0.3 * S, 0.15 * S);
    ctx.fillRect(sx(c.x) + 1.3 * S, gy + (c.v > 0 ? 1.35 : 2.45) * S, 0.3 * S, 0.15 * S);
  }
  for (const p of walkers) {
    ctx.fillStyle = p.c;
    ctx.fillRect(sx(p.x), gy - 0.55 * S, 0.22 * S, 0.5 * S);
    ctx.beginPath(); ctx.arc(sx(p.x) + 0.11 * S, gy - 0.65 * S, 0.12 * S, 0, 7); ctx.fillStyle = '#f2c9a0'; ctx.fill();
  }

  // ビル本体
  const bx0 = sx(0), bx1 = sx(BW), by0 = sy(0);
  ctx.fillStyle = '#d9d2c3'; ctx.fillRect(bx0, by0, bx1 - bx0, gy - by0);
  ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1;
  for (let f = 0; f <= FLOORS; f++) { const y = sy(0.5 + f * FH); ctx.beginPath(); ctx.moveTo(bx0, y); ctx.lineTo(bx1, y); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(sx(BW / 2), by0); ctx.lineTo(sx(BW / 2), gy); ctx.stroke();
  // 入口
  ctx.fillStyle = '#5c6b78'; ctx.fillRect(sx(4.5), sy(GROUND - 2.4), 3 * S, 2.4 * S);
  // 階数
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.font = `bold ${Math.round(0.4 * S)}px sans-serif`;
  for (let f = 0; f < FLOORS; f++) ctx.fillText(`${FLOORS - f}F`, sx(0.15), sy(0.5 + f * FH + 0.5));

  // 屋上
  ctx.fillStyle = '#bfb6a5'; ctx.fillRect(bx0 - 0.2 * S, sy(-0.25), bx1 - bx0 + 0.4 * S, 0.25 * S);
  ctx.fillStyle = '#7f8c8d'; ctx.fillRect(sx(9.3), sy(-1.6), 1.8 * S, 1.35 * S); // 給水タンク
  ctx.fillStyle = '#95a5a6'; ctx.fillRect(sx(9.1), sy(-1.75), 2.2 * S, 0.2 * S);
  ctx.fillStyle = '#3b8fd8'; ctx.fillRect(sx(4.2), sy(-0.65), 0.7 * S, 0.4 * S); // 水の補充所
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.font = `${Math.round(0.28 * S)}px sans-serif`;
  ctx.fillText('屋上に戻ると水が満タン', sx(3.6), sy(-0.85));
  // レール
  ctx.strokeStyle = '#555'; ctx.lineWidth = 0.08 * S;
  ctx.beginPath(); ctx.moveTo(sx(0), sy(-0.3)); ctx.lineTo(sx(BW), sy(-0.3)); ctx.stroke();

  // 窓
  for (const w of windows) drawWindow(w);

  // ハトの巣
  ctx.fillStyle = '#8a6a43';
  ctx.beginPath(); ctx.ellipse(sx(pigeon.nx), sy(pigeon.ny - 0.08), 0.35 * S, 0.12 * S, 0, 0, 7); ctx.fill();

  // ロープとプレイヤー
  if (!P.onRoof) {
    ctx.strokeStyle = '#e67e22'; ctx.lineWidth = Math.max(2, 0.06 * S);
    ctx.beginPath(); ctx.moveTo(sx(P.ax), sy(-0.3)); ctx.lineTo(sx(P.x), sy(P.y - 0.6)); ctx.stroke();
    ctx.fillStyle = '#333'; ctx.fillRect(sx(P.ax) - 0.2 * S, sy(-0.45), 0.4 * S, 0.3 * S);
  }
  drawPlayer();
  drawPigeon();

  // 落ちていくバケツ
  for (const f of falling) {
    ctx.save(); ctx.translate(sx(f.x), sy(f.y)); ctx.rotate(f.rot);
    ctx.fillStyle = '#3b8fd8'; ctx.fillRect(-0.18 * S, -0.2 * S, 0.36 * S, 0.4 * S);
    ctx.restore();
  }

  // 粒
  for (const p of particles) {
    if (p.kind === 'drop') { ctx.fillStyle = 'rgba(120,180,240,.8)'; ctx.fillRect(sx(p.x), sy(p.y), 0.06 * S, 0.1 * S); }
    else if (p.kind === 'leaf') { ctx.fillStyle = '#6aa84f'; ctx.fillRect(sx(p.x), sy(p.y), 0.15 * S, 0.08 * S); }
    else { ctx.fillStyle = '#fff'; ctx.fillRect(sx(p.x), sy(p.y), 0.3 * S, 0.22 * S); }
  }

  // 突風の予告
  if (gust.warn > 0 || gust.active > 0) {
    ctx.strokeStyle = gust.active > 0 ? 'rgba(255,255,255,.7)' : 'rgba(255,216,74,.9)';
    ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const y = H * (0.2 + i * 0.13) + Math.sin(time * 3 + i) * 10;
      const x = ((time * 900 * gust.dir + i * 260) % (W + 300) + W + 300) % (W + 300) - 150;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + gust.dir * 120, y); ctx.stroke();
    }
  }

  // ふきだし
  ctx.textAlign = 'center';
  for (const b of bubbles) {
    const a = Math.min(1, b.t * 3);
    const rise = (b.max - b.t) * 0.4;
    const x = sx(b.x), y = sy(b.y - rise);
    ctx.font = `bold ${b.size}px sans-serif`;
    const tw = ctx.measureText(b.text).width;
    ctx.globalAlpha = a;
    ctx.fillStyle = b.color; ctx.strokeStyle = '#2b2622'; ctx.lineWidth = 2;
    roundRect(x - tw / 2 - 8, y - b.size - 6, tw + 16, b.size + 12, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = b.ink; ctx.fillText(b.text, x, y + 1);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';

  // スクイージー（マウス）
  if (state === 'play') {
    const mxw = wx(mouse.x), myw = wy(mouse.y);
    const ok = Math.hypot(mxw - P.x, myw - (P.y - 0.3)) <= REACH;
    if (!ok) {
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx(P.x), sy(P.y - 0.3), REACH * S, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.save(); ctx.translate(mouse.x, mouse.y);
    ctx.globalAlpha = ok ? 1 : 0.4;
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(-WIPE_R * S, -0.06 * S, WIPE_R * 2 * S, 0.12 * S);
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(-0.04 * S, 0.06 * S, 0.08 * S, 0.45 * S);
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawWindow(w) {
  const x0 = sx(w.x), y0 = sy(w.y), ww = w.w * S, hh = w.h * S;
  if (y0 > H + 50 || y0 + hh < -50) return;
  // 中の部屋
  const ig = ctx.createLinearGradient(0, y0, 0, y0 + hh);
  ig.addColorStop(0, '#dfeaf2'); ig.addColorStop(1, '#b8c9d6');
  ctx.fillStyle = ig; ctx.fillRect(x0, y0, ww, hh);
  ctx.fillStyle = '#f7f3e8'; ctx.fillRect(x0 + ww * 0.1, y0 + hh * 0.05, ww * 0.15, hh * 0.2); // 天井の照明
  ctx.fillRect(x0 + ww * 0.6, y0 + hh * 0.05, ww * 0.15, hh * 0.2);
  if (w.interior === 'meeting') {
    ctx.fillStyle = '#8d6e52'; ctx.fillRect(x0 + ww * 0.15, y0 + hh * 0.7, ww * 0.7, hh * 0.08);
    for (let i = 0; i < 4; i++) { ctx.fillStyle = '#34495e'; ctx.beginPath(); ctx.arc(x0 + ww * (0.22 + i * 0.18), y0 + hh * 0.6, hh * 0.07, 0, 7); ctx.fill(); ctx.fillRect(x0 + ww * (0.22 + i * 0.18) - hh * 0.07, y0 + hh * 0.66, hh * 0.14, hh * 0.1); }
    ctx.fillStyle = '#fff'; ctx.fillRect(x0 + ww * 0.35, y0 + hh * 0.18, ww * 0.3, hh * 0.25);
  } else if (w.interior === 'kitchen') {
    ctx.fillStyle = '#ecf0f1'; ctx.fillRect(x0 + ww * 0.1, y0 + hh * 0.6, ww * 0.8, hh * 0.4);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(x0 + ww * 0.7, y0 + hh * 0.45, ww * 0.08, hh * 0.15);
  } else if (w.interior === 'storage') {
    ctx.fillStyle = '#c8a46a';
    for (let i = 0; i < 5; i++) ctx.fillRect(x0 + ww * (0.1 + (i % 3) * 0.25), y0 + hh * (0.75 - Math.floor(i / 3) * 0.2), ww * 0.2, hh * 0.2);
  } else {
    for (let i = 0; i < 2; i++) {
      ctx.fillStyle = '#7f8c8d'; ctx.fillRect(x0 + ww * (0.12 + i * 0.45), y0 + hh * 0.72, ww * 0.35, hh * 0.06);
      ctx.fillStyle = '#2c3e50'; ctx.fillRect(x0 + ww * (0.2 + i * 0.45), y0 + hh * 0.5, ww * 0.16, hh * 0.2);
    }
  }
  // 窓辺の人
  if (w.person) {
    const a = Math.min(1, w.person.t, (4.5 - w.person.t) * 2);
    ctx.globalAlpha = a;
    const px = x0 + w.person.px * S, py = y0 + hh;
    ctx.fillStyle = '#4a5a6a'; roundRect(px - 0.45 * S, py - 0.9 * S, 0.9 * S, 0.9 * S, 0.3 * S); ctx.fill();
    ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(px, py - 1.2 * S, 0.32 * S, 0, 7); ctx.fill();
    ctx.fillStyle = '#2b2622'; ctx.beginPath(); ctx.arc(px - 0.1 * S, py - 1.22 * S, 0.035 * S, 0, 7); ctx.arc(px + 0.1 * S, py - 1.22 * S, 0.035 * S, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // ガラスの反射
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.moveTo(x0 + ww * 0.1, y0); ctx.lineTo(x0 + ww * 0.3, y0); ctx.lineTo(x0 + ww * 0.1, y0 + hh); ctx.lineTo(x0 - ww * 0.1 < x0 ? x0 : x0, y0 + hh); ctx.closePath(); ctx.fill();
  // 汚れ（小さいキャンバスに描いて、なめらかに拡大する）
  if (!w.cv) { w.cv = document.createElement('canvas'); w.cv.width = GX; w.cv.height = GY; }
  if (w.dirty) {
    const c2 = w.cv.getContext('2d'), img = c2.createImageData(GX, GY);
    for (let i = 0; i < w.cells.length; i++) {
      img.data[i * 4] = 110; img.data[i * 4 + 1] = 92; img.data[i * 4 + 2] = 62;
      img.data[i * 4 + 3] = Math.round(w.cells[i] * 0.9 * 255);
    }
    c2.putImageData(img, 0, 0);
    w.dirty = false;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(w.cv, x0, y0, ww, hh);
  // 枠とでっぱり
  ctx.strokeStyle = '#6b6e70'; ctx.lineWidth = Math.max(2, 0.08 * S);
  ctx.strokeRect(x0, y0, ww, hh);
  ctx.beginPath(); ctx.moveTo(x0 + ww / 2, y0); ctx.lineTo(x0 + ww / 2, y0 + hh); ctx.stroke();
  ctx.fillStyle = '#a39b8b'; ctx.fillRect(x0 - 0.25 * S, y0 + hh, ww + 0.5 * S, 0.18 * S);
  // ピカッ
  if (w.sparkle > 0) {
    ctx.globalAlpha = Math.min(1, w.sparkle);
    ctx.fillStyle = '#fffbe0';
    for (let i = 0; i < 5; i++) {
      const sxp = x0 + ww * ((i * 0.23 + 0.1) % 1), syp = y0 + hh * ((i * 0.37 + 0.2) % 1), r = (0.15 + 0.1 * Math.sin(time * 10 + i)) * S;
      ctx.beginPath(); ctx.moveTo(sxp, syp - r); ctx.lineTo(sxp + r * 0.25, syp); ctx.lineTo(sxp, syp + r); ctx.lineTo(sxp - r * 0.25, syp); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sxp - r, syp); ctx.lineTo(sxp, syp + r * 0.25); ctx.lineTo(sxp + r, syp); ctx.lineTo(sxp, syp - r * 0.25); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  const x = sx(P.x), y = sy(P.y);
  const sway = P.onRoof ? 0 : clamp(P.vx * 0.08, -0.5, 0.5);
  ctx.save(); ctx.translate(x, y); ctx.rotate(sway + (P.stun > 0 ? Math.sin(time * 30) * 0.2 : 0));
  // 脚
  ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 0.16 * S; ctx.lineCap = 'round';
  const kick = P.onRoof ? Math.sin(time * 10) * 0.15 * (keys.KeyA || keys.KeyD ? 1 : 0) : (P.onSill ? 0 : Math.sin(time * 2) * 0.1);
  ctx.beginPath(); ctx.moveTo(-0.12 * S, 0.2 * S); ctx.lineTo((-0.15 + kick) * S, 0.78 * S); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.12 * S, 0.2 * S); ctx.lineTo((0.15 - kick) * S, 0.78 * S); ctx.stroke();
  // 体（作業着）
  ctx.fillStyle = '#2f80c9'; roundRect(-0.28 * S, -0.5 * S, 0.56 * S, 0.8 * S, 0.12 * S); ctx.fill();
  // ハーネス
  ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 0.06 * S;
  ctx.beginPath(); ctx.moveTo(-0.26 * S, -0.3 * S); ctx.lineTo(0.26 * S, 0.15 * S); ctx.moveTo(0.26 * S, -0.3 * S); ctx.lineTo(-0.26 * S, 0.15 * S); ctx.stroke();
  // バケツ
  if (P.water > 0 || P.onRoof) { ctx.fillStyle = '#3b8fd8'; ctx.fillRect(0.28 * S, 0 * S, 0.26 * S, 0.3 * S); }
  // 腕
  ctx.strokeStyle = '#2f80c9'; ctx.lineWidth = 0.13 * S;
  const mxw = wx(mouse.x), myw = wy(mouse.y);
  const ang = Math.atan2(myw - (P.y - 0.3), mxw - P.x) - (sway);
  const armLen = 0.55 * S;
  if (P.cling) {
    ctx.beginPath(); ctx.moveTo(-0.2 * S, -0.35 * S); ctx.lineTo(-0.45 * S, -0.75 * S); ctx.moveTo(0.2 * S, -0.35 * S); ctx.lineTo(0.45 * S, -0.75 * S); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-0.2 * S, -0.35 * S); ctx.lineTo(-0.1 * S, -0.95 * S); ctx.stroke(); // ロープをつかむ手
    ctx.beginPath(); ctx.moveTo(0.2 * S, -0.35 * S); ctx.lineTo(0.2 * S + Math.cos(ang) * armLen, -0.35 * S + Math.sin(ang) * armLen); ctx.stroke();
  }
  // 頭とヘルメット
  ctx.fillStyle = '#f2c9a0'; ctx.beginPath(); ctx.arc(0, -0.72 * S, 0.24 * S, 0, 7); ctx.fill();
  ctx.fillStyle = '#f6c02c'; ctx.beginPath(); ctx.arc(0, -0.78 * S, 0.26 * S, Math.PI, 0); ctx.fill();
  ctx.fillRect(-0.3 * S, -0.8 * S, 0.6 * S, 0.06 * S);
  // 顔
  ctx.fillStyle = '#2b2622';
  const scared = P.grip < 25 || P.stun > 0 || gust.active > 0;
  const eyeR = (scared ? 0.05 : 0.03) * S;
  ctx.beginPath(); ctx.arc(-0.08 * S, -0.7 * S, eyeR, 0, 7); ctx.arc(0.08 * S, -0.7 * S, eyeR, 0, 7); ctx.fill();
  if (scared) { ctx.beginPath(); ctx.ellipse(0, -0.58 * S, 0.06 * S, 0.05 * S, 0, 0, 7); ctx.fill(); }
  ctx.restore();
  if (P.grip < 25 && !P.onRoof) {
    ctx.fillStyle = '#7fc8ff';
    ctx.beginPath(); ctx.arc(x + 0.3 * S, y - 0.95 * S + (time * 40 % 15), 0.06 * S, 0, 7); ctx.fill();
  }
}

function drawPigeon() {
  const pg = pigeon;
  const x = sx(pg.x), y = sy(pg.y);
  const flying = pg.mode !== 'nest';
  ctx.save(); ctx.translate(x, y - 0.18 * S);
  ctx.fillStyle = '#8e9aa6';
  ctx.beginPath(); ctx.ellipse(0, 0, 0.24 * S, 0.16 * S, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#6c7a89'; ctx.beginPath(); ctx.arc(0.2 * S, -0.12 * S, 0.1 * S, 0, 7); ctx.fill();
  ctx.fillStyle = '#e67e22'; ctx.fillRect(0.28 * S, -0.13 * S, 0.07 * S, 0.03 * S);
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0.23 * S, -0.14 * S, 0.02 * S, 0, 7); ctx.fill();
  if (flying) {
    const f = Math.sin(time * 40) * 0.25 * S;
    ctx.fillStyle = '#7f8c8d';
    ctx.beginPath(); ctx.moveTo(-0.05 * S, -0.05 * S); ctx.lineTo(-0.3 * S, -0.2 * S - f); ctx.lineTo(0.1 * S, -0.05 * S); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// =====================================================================
// ループ
// =====================================================================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'play') update(dt);
  else { time += dt; for (const c of clouds) c.x += c.v * dt; }
  draw();
}

newGame();
$('startBtn').onclick = () => {
  audio();
  $('start').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('help').classList.remove('hidden');
  newGame();
  state = 'play';
  banner('Sでロープを下りて、窓をふこう！', '', 2.5);
};
requestAnimationFrame(frame);
</script>
</body>
